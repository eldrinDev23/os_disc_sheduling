
<!DOCTYPE html>
<html>
<head>
<title>OS Scheduling Visualizer</title>

<style>
body {
    font-family: Arial;
    background: #d9ced1;
    color: #7a1b39;
    text-align: center;
    padding: 20px;
}
.container {
    background: white;
    padding: 20px;
    max-width: 700px;
    margin: auto;
    border-radius: 12px;
}
input, select, button {
    padding: 10px;
    margin: 7px;
    border: 1px solid #7a1b39;
    border-radius: 5px;
}
button {
    background: #7a1b39;
    color: white;
    cursor: pointer;
}
canvas {
    width: 100%;
    max-width: 600px;
    margin-top: 20px;
}
</style>
</head>

<body>

<div class="container">
<h2>OS Disk Scheduling Visualizer</h2>

<input id="size" type="number" value="200" placeholder="Disk size">
<input id="head" type="number" value="50" placeholder="Initial head">

<br>

<input id="requests" value="82,170,43,140,24,16,190"
placeholder="Request queue">

<br>

<select id="algorithm">
<option>FCFS</option>
<option>SSTF</option>
<option>SCAN</option>
<option>C-SCAN</option>
<option>LOOK</option>
</select>

<select id="direction">
<option value="right">Right</option>
<option value="left">Left</option>
</select>

<br>
<button onclick="run()">Run Algorithm</button>

<h3>Head Movement Graph</h3>
<canvas id="graph" width="600" height="300"></canvas>

<h3 id="sequence"></h3>
<h3 id="movement"></h3>
</div>

<script>
function run() {
    let size = Number(document.getElementById("size").value);
    let head = Number(document.getElementById("head").value);
    let queue = document.getElementById("requests").value
        .split(",").map(Number);
    let algo = document.getElementById("algorithm").value;
    let dir = document.getElementById("direction").value;

    if (!size || head < 0 || head >= size ||
        queue.some(x => !Number.isInteger(x) || x < 0 || x >= size)) {
        alert("Enter valid disk values and requests");
        return;
    }

    let path = [head];
    let remaining = [...queue];
    let total = 0;

    if (algo === "FCFS") {
        path.push(...remaining);
    }

    else if (algo === "SSTF") {
        while (remaining.length) {
            remaining.sort((a,b) =>
                Math.abs(a - path[path.length-1]) -
                Math.abs(b - path[path.length-1]));
            path.push(remaining.shift());
        }
    }

    else {
        let left = remaining.filter(x => x < head).sort((a,b) => a-b);
        let right = remaining.filter(x => x >= head).sort((a,b) => a-b);

        if (dir === "right") {
            path.push(...right);

            if (algo === "SCAN" || algo === "C-SCAN")
                path.push(size - 1);

            if (algo === "C-SCAN")
                path.push(0);

            path.push(...(algo === "SCAN" || algo === "C-SCAN"
                ? left.reverse() : left.reverse()));
        } else {
            path.push(...left.reverse());

            if (algo === "SCAN" || algo === "C-SCAN")
                path.push(0);

            if (algo === "C-SCAN")
                path.push(size - 1);

            path.push(...right);
        }
    }

    for (let i = 1; i < path.length; i++)
        total += Math.abs(path[i] - path[i-1]);

    document.getElementById("sequence").innerText =
        "Sequence: " + path.join(" → ");

    document.getElementById("movement").innerText =
        "Total Head Movement: " + total;

    drawGraph(path, size);
}

function drawGraph(path, size) {
    let canvas = document.getElementById("graph");
    let ctx = canvas.getContext("2d");

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    let x = i => 40 + i * 520 / Math.max(1, path.length - 1);
    let y = value => 270 - value / (size - 1) * 240;

    ctx.beginPath();
    ctx.strokeStyle = "#7a1b39";
    ctx.lineWidth = 3;

    path.forEach((value, i) => {
        if (i === 0) ctx.moveTo(x(i), y(value));
        else ctx.lineTo(x(i), y(value));
    });

    ctx.stroke();

    path.forEach((value, i) => {
        ctx.beginPath();
        ctx.arc(x(i), y(value), 5, 0, Math.PI * 2);
        ctx.fillStyle = "#7a1b39";
        ctx.fill();

        ctx.fillText(value, x(i) - 10, y(value) - 10);
    });
}
</script>

</body>
</html>
